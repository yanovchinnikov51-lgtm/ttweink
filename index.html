<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#020107" />
  <title>WEINK1 — 3D Tunnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="scene"></div>

    <div id="startScreen">
      <div class="startGlow"></div>
      <div class="brand">WEINK1</div>
      <div class="sub">DIGITAL TUNNEL</div>
      <button id="startBtn">START EXPERIENCE</button>
      <div class="hint">tap to enter</div>
    </div>

    <div id="hud" class="hidden">
      <div class="topBrand">WEINK1</div>
      <div class="controls">
        <button id="pauseBtn">Ⅱ</button>
        <button id="restartBtn">↻</button>
        <button id="musicBtn">♪</button>
      </div>
      <div id="toast"></div>
    </div>

    <audio id="music" loop preload="none"></audio>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="script.js"></script>

<div id="explosionHud">
  <div id="explosionLabel">EXPLOSIONS</div>
  <div id="explosionScore">0</div>
  <div id="motivation">KEEP GOING!</div>
</div>

</body>
</html>
